<!doctype html>
<!-- Dev only: the phone layout (src/mobile/, phones other than iPhones) in a phone-sized frame. Open
     /src/mobile/preview.html on the dev server; the iPhone layout has its own, /src/iphone/preview.html.
     Not part of the build (vite only builds the root index.html). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 24px 16px; box-sizing: border-box;
      background: #e8eff7; font: 500 14px system-ui, sans-serif; color: #082852;
    }
    .phone {
      box-sizing: content-box; width: 385px; height: 890px; max-width: 100%;
      border: 10px solid #111; border-radius: 36px; overflow: hidden;
      background: #fff; box-shadow: 0 20px 48px rgba(8, 40, 82, .25);
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    nav :is(a, button) {
      padding: 4px 10px; border: 0; border-radius: 999px;
      background: #fff; color: inherit; font: inherit; text-decoration: none; cursor: pointer;
    }
    nav button[aria-pressed='true'] { background: #082852; color: #fff; }
  </style>
</head>
<body>
  <nav id="devices">
    <button type="button" data-w="385" data-h="890" aria-pressed="true">Reference 385 × 890</button>
    <button type="button" data-w="360" data-h="800">Small Android 360 × 800</button>
    <button type="button" data-w="412" data-h="915">Large Android 412 × 915</button>
  </nav>
  <nav id="pages">
    <a href="/">Home</a>
    <a href="/about-us">About</a>
    <a href="/schedule">Schedule</a>
    <a href="/speakers">Speakers</a>
    <a href="/summit-gallery">Summit Gallery</a>
  </nav>
  <!-- the border sits outside the screen -->
  <div class="phone" id="phone"><iframe id="screen" src="/" title="Site in a phone-sized frame"></iframe></div>
  <span id="size">Reference 385 × 890px</span>

  <script>
    const phone = document.getElementById('phone')
    const screen = document.getElementById('screen')
    let page = '/'
    const show = () => { screen.src = page }
    document.querySelectorAll('#devices button').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('#devices button').forEach((o) => o.setAttribute('aria-pressed', o === b))
      phone.style.width = b.dataset.w + 'px'
      phone.style.height = b.dataset.h + 'px'
      document.getElementById('size').textContent = b.textContent
      show()
    }))
    document.querySelectorAll('#pages a').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault()
      page = a.getAttribute('href')
      show()
    }))
  </script>
</body>
</html>
