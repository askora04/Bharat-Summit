<!doctype html>
<!-- Dev only: the site in the 385 × 890px reference phone. Open /src/mobile/preview.html on the dev server.
     Not part of the build (vite only builds the root index.html). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 24px 16px; box-sizing: border-box;
      background: #e8eff7; font: 500 14px system-ui, sans-serif; color: #082852;
    }
    .phone {
      width: 385px; height: 890px; max-width: 100%;
      border: 10px solid #111; border-radius: 36px; overflow: hidden;
      background: #fff; box-shadow: 0 20px 48px rgba(8, 40, 82, .25);
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    nav a { padding: 4px 10px; border-radius: 999px; background: #fff; color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a href="/" target="screen">Home</a>
    <a href="/about-us" target="screen">About</a>
    <a href="/schedule" target="screen">Schedule</a>
    <a href="/speakers" target="screen">Speakers</a>
    <a href="/events" target="screen">Archives</a>
  </nav>
  <!-- the border sits outside the 385 × 890 screen -->
  <div class="phone" style="box-sizing: content-box"><iframe name="screen" src="/" title="Site at 385 × 890"></iframe></div>
  <span>385 × 890px</span>
</body>
</html>
